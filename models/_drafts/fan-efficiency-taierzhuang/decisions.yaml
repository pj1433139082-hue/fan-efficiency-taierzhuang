- id: requirements-context
  stage: requirements
  blocks_transition: specified
  level: ASK
  required: true
  question: 模型解决什么问题、由谁使用、多久执行一次，哪些事项不在范围内？
  recommendation: 本期只做台儿庄 6 台曝气风机的单机效率实时计算：输入 4 个实时测点（进口风量、出口压力、电机输入功率、进口温度）+ 1 个海拔配置常数，执行周期 1 分钟（对 15 秒采样取均值），输出 Excel 口径与修正口径两个效率。不做最优组合、不做闭环回写、不做曝气器核算，跨厂通用化后置。
  status: confirmed
  answer: 范围=台儿庄一污 4#/5#/6# 与二污 1#/2#/3# 共 6 台离心曝气风机的单机效率实时计算；使用者=现场运行值班与工艺工程师、区域能耗与设备管理、模型维护者；执行频率=每分钟一次（1 分钟内 15 秒采样取均值后计算）；非目标=最优组合与配组推荐（另立 fan-combination-taierzhuang 工作区）、效率闭环控制回写、曝气器数量与充氧效率核算、跨厂通用化。
  confirmed_by: <owner-id>
  confirmed_at: '2026-10-17T16:50:00+08:00'
  evidence: model-spec.md#1-需求
- id: requirements-io-contract
  stage: requirements
  blocks_transition: specified
  level: ASK
  required: true
  question: 模型输入和输出分别是什么，它们的类型、单位和业务含义是什么？
  recommendation: 输入 5 项：inlet_flow（m3/min，工况流量）、outlet_pressure（kPa，表压）、motor_power（kW，电机输入）、inlet_temperature（℃，进口温度）、elevation（m，配置常数）。输出 4 项：eta_excel、eta_corrected（无量纲 0~1）、wp_excel、wp_corrected（kW）。平台生效按 Excel 口径，修正口径作伴随字段。
  status: confirmed
  answer: 按推荐：输入为进口风量（m3/min，工况口径，厂家口径待确认）、出口压力（kPa，表压）、电机输入功率（kW）、进口温度（℃）、设计海拔（m，配置常数）；输出为 eta_excel 与 eta_corrected（无量纲 0~1）、wp_excel 与 wp_corrected（kW）。平台部署与对外生效读 eta_excel，修正口径仅用于对账，见 requirements-output-caliber。
  confirmed_by: <owner-id>
  confirmed_at: '2026-10-17T16:50:00+08:00'
  evidence: model.yaml#contract
- id: requirements-acceptance
  stage: requirements
  blocks_transition: specified
  level: CONFIRM
  required: true
  question: 哪些可验证条件满足后，模型才算达到业务验收标准？
  recommendation: 四条可自动化断言：①公式复现（示例输入 eta_excel=86.20%、wp_excel=62.406 kW、eta_corrected=87.61%、wp_corrected=63.431 kW，容差 0.01 个百分点）；②台账断面复现（一污 4# 73.12%、一污 5# 77.49%、二污 2# 67.97%，容差 0.05 个百分点）；③差值指纹（修正减 Excel：t≈20℃ 为 0、5℃ 高估约 5.4%、30℃ 低估约 3.3%）；④缺任一必需输入时两口径同时置空且带质量标记，不补零。
  status: confirmed
  answer: 接受上述四条为业务验收标准，全部可复现、可写成自动化断言；其中第 3 条差值指纹用于证明两个口径都算对，而不是只对一个。
  confirmed_by: <owner-id>
  confirmed_at: '2026-10-17T16:50:00+08:00'
  evidence: model-spec.md#可验证的验收标准
