  model_lab: '>=0.1.0,<1.0.0'
model:
  id: fan-efficiency-taierzhuang
  name: 风机效率实时计算（台儿庄）
  version: 0.1.0
  lifecycle_state: releasable
  owner: <owner-id>
target:
  kind: cpu-iot
  environment:
    operating_system: linux
    architecture: x86_64
    python: '>=3.11,<3.12'
    mlflow: ==2.22.2
    package_format: mlflow-pyfunc
    dependency_lock: runtime/requirements.lock.txt
    native_runtime:
      kind: none
contract:
  inputs:
  - name: inlet_flow
    type: number
    unit: m3/min
  - name: outlet_pressure
    type: number
    unit: kPa
  - name: motor_power
    type: number
    unit: kW
  - name: inlet_temperature
    type: number
    unit: C
  - name: elevation
    type: number
    unit: m
  outputs:
  - name: eta_excel
    type: number
    unit: '1'
  - name: eta_corrected
    type: number
    unit: '1'
  - name: wp_excel
    type: number
    unit: kW
  - name: wp_corrected
    type: number
    unit: kW
  - name: quality
    type: string
    unit: code
